name: Security audit

on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
