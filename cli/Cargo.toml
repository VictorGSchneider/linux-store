[package]
name = "store-cli"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Command-line front end to refresh, search and list packages (used to verify linux-store)"

[lib]
name = "store_cli"
path = "src/lib.rs"

[[bin]]
name = "store"
path = "src/main.rs"

[dependencies]
store-core = { path = "../core" }
store-protocol = { path = "../protocol" }
store-installer-pkexec = { path = "../installers/pkexec" }
store-backend-pacman = { path = "../backends/pacman" }
store-backend-aur = { path = "../backends/aur" }
store-backend-flatpak = { path = "../backends/flatpak" }
clap = { version = "4.6.8", features = ["derive"] }

[dev-dependencies]
store-core = { path = "../core", features = ["testing"] }
tempfile = "3.27.0"
